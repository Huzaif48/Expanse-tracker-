<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            list-style: none;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            min-height: 70px;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0 20px;
        }

        header h1 {
            font-size: clamp(1.2rem, 5vw, 1.8rem);
        }

        header ul {
            display: flex;
            gap: clamp(0.75rem, 3vw, 30px);
        }

        header ul a {
            color: #fff;
            text-decoration: none;
            font-size: clamp(0.85rem, 2.5vw, 1rem);
        }

        .icon {
            font-size: 28px;
            position: fixed;
            top: 18px;
            right: 14px;
            z-index: 1100;
            width: 44px;
            height: 44px;
            display: none;
            align-items: center;
            justify-content: center;
            background: #333;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
        }

        nav {
            width: 200px;
            height: 100vh;
            height: 100dvh;
            background-color: #444;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 20px;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            text-align: center;
            z-index: 1000;
        }

        nav ul li {
            margin-top: 30px;
        }

        nav ul a {
            color: #fff;
            text-decoration: none;
        }

        .show {
            transform: translateX(0);
        }

        @media (max-width: 768px) {
            header ul {
                display: none;
            }

            .icon {
                display: flex;
            }
        }

        @media (max-width: 400px) {
            header {
                padding: 0 12px;
            }

            .icon {
                top: 12px;
                right: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="icon" onclick="nav()" aria-label="Toggle menu">|||</div>
    <header>
        <h1>Dashboard</h1>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Profile</a></li>
            <li><a href="#">Settings</a></li>
            <li><a href="#">Logout</a></li>
        </ul>
    </header>


    <nav id="nav1">
        <h1>Dashboard</h1>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Profile</a></li>
            <li><a href="#">Settings</a></li>
            <li><a href="#">Logout</a></li>
        </ul>
    </nav>

</body>

<script>
    function nav() {
        document.getElementById("nav1").classList.toggle("show")
    }
</script>

</html>
